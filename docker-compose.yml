# Local development services: PostgreSQL 18 (app data), Redis 8.10 (cache, rate limits) and MongoDB 8 (log store).
#
#   docker compose up -d        start in the background (add --wait to block until all are healthy)
#   docker compose down         stop, keep data
#   docker compose down -v      stop and delete data (the MongoDB init script runs again on the next up;
#                               after editing infra/mongo/init.js add --build to that up)
#
# Credentials are throwaway local values, and every port is published on 127.0.0.1 only.
# They must match the URLs in .env.example. Never reuse them outside local development.
# Host ports can be changed in .env (POSTGRES_PORT, REDIS_PORT, MONGO_PORT) when a default is taken.
# Tests use docker-compose.test.yml, which is a separate project with its own ports and no shared data.

name: app-dev

services:
  postgres:
    # Debian image, not -alpine: musl has no locale-aware collation, so ORDER BY on text would sort
    # differently here than on a typical glibc production server.
    image: postgres:18
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_dev
      POSTGRES_DB: app
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # postgres:18 keeps its data under /var/lib/postgresql/18/docker and refuses to start with a mount at
      # /var/lib/postgresql/data, so the volume is mounted one level up.
      - postgres18_data:/var/lib/postgresql
    healthcheck:
      # -h 127.0.0.1 forces TCP: during first-time init the image runs a socket-only server that would pass a plain check.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    # Pinned to the digest of its multi-arch index, so every stack and CI's image scan run the same build until a
    # deliberate bump. The same pin is in docker-compose.dev.yml and docker-compose.test.yml (the one CI runs and scans).
    image: redis:8.10.3-alpine@sha256:71885d8cc6e42f2bc0aa2eb853bfc4be200b5108a46ac50e117ae1df0531fb80
    # Not a store of record (ARCHITECTURE §6): no snapshots, no AOF, nothing kept between container re-creations.
    # Bounded memory. Every key the API writes (module cache, Better Auth's auth: counters and values)
    # has a TTL, so allkeys-lru evicts the least recently used key rather than refusing writes. An
    # evicted rate-limit counter loses its count and its window restarts. 256mb is a dev default:
    # size maxmemory per deployment in production. Not volatile-lru: it spares only keys without a
    # TTL, and the rate-limit counters have one, so it would protect nothing here, and a stray key
    # without a TTL could never be evicted.
    # The image's entrypoint drops root (setpriv to the redis user) only when the command is redis-server, and
    # then also loads the image's bundled modules (JSON, Search, TimeSeries, Bloom). The API uses none of them.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongo:
    # Pinned mongo:8.3.13 plus infra/mongo/init.js and the GLIBC_TUNABLES workaround, without the eight unused
    # MongoDB Database Tools (see the Dockerfile).
    build: ./infra/mongo
    environment:
      # Setting the root user turns authentication on. Root is only used by the init script.
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root_dev
      MONGO_INITDB_DATABASE: app_logs
      LOG_WRITER_PASSWORD: log_writer_dev
      LOG_ADMIN_PASSWORD: log_admin_dev
      LOG_READER_PASSWORD: log_reader_dev
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    healthcheck:
      # Authenticating as log_admin only succeeds once the init script has created the users, so "healthy"
      # means the log users exist. A bare ping would pass while the temporary init server is still running.
      test: ["CMD-SHELL", 'mongosh --quiet --host "$$(hostname)" -u log_admin -p "$$LOG_ADMIN_PASSWORD" --authenticationDatabase "$$MONGO_INITDB_DATABASE" --eval "db.runCommand({ ping: 1 })"']
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 20s

volumes:
  # New name for PostgreSQL 18, which starts empty (README: "Upgrading the dev database to PostgreSQL 18").
  # The PostgreSQL 17 volume `<project>_postgres_data` is no longer declared here, so `down -v` does not
  # remove it and its data stays until someone deletes it on purpose.
  postgres18_data:
  mongo_data:
  mongo_config:
