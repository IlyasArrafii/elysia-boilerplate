# Sokudo-managed development infrastructure. Start with the Compose panel's Up action.
# API and web run locally with bun run dev. Shared service settings mirror docker-compose.yml.
# Mongo uses an inline bootstrap to avoid Sokudo's Windows build-context translation issue.
# Sokudo supplies the engine and workspace overrides.
# PostgreSQL 17 (app data), Valkey 9 (Redis-compatible cache) and MongoDB 8 (log store).
#
# Use Sokudo's Compose Up/Down actions so its engine, project name and port overrides apply.
# Down preserves named volumes. MongoDB initialization only runs against an empty volume;
# changing the bootstrap does not update existing users or roles.
#
# Credentials are throwaway local values, and every port is published on 127.0.0.1 only.
# They must match the URLs in .env.example. Never reuse them outside local development.
# Host ports can be changed in .env (POSTGRES_PORT, REDIS_PORT, MONGO_PORT) when a default is taken.
# Tests use docker-compose.test.yml, which is a separate project with its own ports and no shared data.

name: app-dev

services:
  postgres:
    # Debian image, not -alpine: musl has no locale-aware collation, so ORDER BY on text would sort
    # differently here than on a typical glibc production server.
    image: postgres:17
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_dev
      POSTGRES_DB: app
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1 forces TCP: during first-time init the image runs a socket-only server that would pass a plain check.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    # Same pin as docker-compose.yml (see there).
    image: valkey/valkey:9.1.3-alpine@sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b
    # Not a store of record (ARCHITECTURE §6): no snapshots, no AOF, nothing kept between container re-creations.
    # Bounded memory. Every key the API writes (module cache, Better Auth's auth: counters and values)
    # has a TTL, so allkeys-lru evicts the least recently used key rather than refusing writes. An
    # evicted rate-limit counter loses its count and its window restarts. 256mb is a dev default:
    # size maxmemory per deployment in production. Not volatile-lru: it spares only keys without a
    # TTL, and the rate-limit counters have one, so it would protect nothing here, and a stray key
    # without a TTL could never be evicted.
    # valkey-server, not its redis-server alias: the image's entrypoint drops root only for that name.
    command: ["valkey-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongo:
    # Same pin as infra/mongo/Dockerfile (the image the .trivyignore.yaml waivers were written for).
    image: mongo:8.3.13@sha256:e16e606f792ea89d2b4907b54e5e31eb86a7a23e27231dce3a982cc8f2d73cd2
    # Keep MONGO_BOOTSTRAP_JS in sync with infra/mongo/init.js. Only an empty data volume
    # runs Mongo's initialization scripts. No Windows bind mount or local image build is needed.
    entrypoint:
      - bash
      - -ec
      - |
        printf '%s\n' "$$MONGO_BOOTSTRAP_JS" > /docker-entrypoint-initdb.d/init.js
        unset MONGO_BOOTSTRAP_JS
        exec /usr/local/bin/docker-entrypoint.sh mongod
    environment:
      MONGO_BOOTSTRAP_JS: |
        const LOG_COLLECTION = 'log_event'
        function requireEnv(name) {
          const value = process.env[name]
          if (!value) throw new Error(name + ' must be set to create the log users')
          return value
        }
        const logDb = db.getSiblingDB(requireEnv('MONGO_INITDB_DATABASE'))
        const logEvent = { db: logDb.getName(), collection: LOG_COLLECTION }
        const logUsers = [
          { user: 'log_writer', passwordEnv: 'LOG_WRITER_PASSWORD', role: 'logWriter', actions: ['insert'] },
          { user: 'log_admin', passwordEnv: 'LOG_ADMIN_PASSWORD', role: 'logAdmin', actions: ['find', 'remove', 'createIndex'] },
          { user: 'log_reader', passwordEnv: 'LOG_READER_PASSWORD', role: 'logReader', actions: ['find'] },
        ]
        for (const { user, passwordEnv, role, actions } of logUsers) {
          logDb.createRole({ role, privileges: [{ resource: logEvent, actions }], roles: [] })
          logDb.createUser({ user, pwd: requireEnv(passwordEnv), roles: [role] })
        }
      # Setting the root user turns authentication on. Root is only used by the init script.
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root_dev
      MONGO_INITDB_DATABASE: app_logs
      LOG_WRITER_PASSWORD: log_writer_dev
      LOG_ADMIN_PASSWORD: log_admin_dev
      LOG_READER_PASSWORD: log_reader_dev
      # SERVER-121912 workaround, as in infra/mongo/Dockerfile (see there and TESTING.md §6.3): tcmalloc uses
      # per-thread caches, so mongod starts on 6.19-7.0.x kernels. Remove it with the Dockerfile's.
      GLIBC_TUNABLES: glibc.pthread.rseq=1
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    healthcheck:
      # Authenticating as log_admin only succeeds once the init script has created the users, so "healthy"
      # means the log users exist. A bare ping would pass while the temporary init server is still running.
      test: ["CMD-SHELL", 'mongosh --quiet --host "$$(hostname)" -u log_admin -p "$$LOG_ADMIN_PASSWORD" --authenticationDatabase "$$MONGO_INITDB_DATABASE" --eval "db.runCommand({ ping: 1 })"']
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 20s

volumes:
  postgres_data:
  mongo_data:
  mongo_config:
