url: http://localhost:3001/
name: health - SSR renders the API status and a browser refetch replaces it through the proxy
tags: [health, smoke]
---
- launchApp
- assertVisible: "API status"
- assertVisible: "PostgreSQL"
# The uptime in the server-rendered page. The API reports whole seconds since it started, so only a newer
# response can change it.
- copyTextFrom:
    text: "\\d+s"
# Ask again until the uptime moves. If "Check again" did not make the browser call /api/health, the old value
# would stay on screen through every iteration and the assertion below would fail.
- repeat:
    times: 50
    while:
      visible: ${maestro.copiedText}
    commands:
      - tapOn: "Check again"
      - extendedWaitUntil:
          visible: "Check again"
          timeout: 5000
- assertNotVisible: ${maestro.copiedText}
- assertVisible: "PostgreSQL"
- takeScreenshot: health-status-refetched
# The browser's request path itself: same origin, proxied to the API (DEC-020).
- openLink: http://localhost:3001/api/health
- assertVisible: "uptime"
