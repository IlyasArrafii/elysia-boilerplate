# Needs E2E environment values E2E_USER_EMAIL and E2E_USER_PASSWORD (an existing account; sign-up only uses the
# password). Empty defaults keep the flow valid; without the values it fails at the form's own check.
url: http://localhost:3001/login
name: auth - a wrong password shows the generic message
tags: [auth]
clearState: true
---
- launchApp
- tapOn: "Email"
- inputText: "${E2E_USER_EMAIL || ''}"
- tapOn: "Password"
- inputText: "not-the-password-0"
- pressKey: Enter
- assertVisible: "Email or password is incorrect."
- assertVisible: "INVALID_EMAIL_OR_PASSWORD"
- takeScreenshot: auth-wrong-password
