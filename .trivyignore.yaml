# Waivers for the Trivy gate of the CI `security` job (TESTING.md §6.2). This file is the only way to
# accept a finding. Never use skip-dirs, skip-files, exit-code 0, continue-on-error, a plain .trivyignore
# or an inline `trivy:ignore` comment instead.
#
# Rules, which the step "Check the waiver file" enforces:
#   - Only the keys vulnerabilities, misconfigurations, secrets and licenses, each a list of entries.
#   - An entry has only the fields id, paths, purls, statement, owner and expired_at. Trivy drops any
#     other field, so a typo such as `path` would silently widen the entry; the check rejects it.
#   - One entry per finding ID, scoped to the exact place the scan report names: `paths` (the result
#     target or package path, no wildcards) and/or `purls` (package at an exact version; a purl without
#     a version matches every version). With both, Trivy needs both to match. A vulnerability entry
#     with neither would accept the ID everywhere, so it is rejected.
#   - A misconfiguration, secret or license entry needs `paths` and must not use `purls`: Trivy matches
#     those findings without a package, so a purl there scopes nothing.
#   - Every entry has a `statement` (why accepting it is safe, and how that was checked), an `owner`
#     (who re-checks it) and an `expired_at` that is a calendar date no later than 2027-02-05, the cap
#     written in the workflow (moving it is a reviewed workflow change). 0001-01-01 is rejected: Trivy
#     reads Go's zero time as "never expires". From `expired_at` on, Trivy stops applying the entry, the
#     finding comes back and the job fails until the owner has looked again.
#   - Fix first: bump the dependency or the image. Waive only what cannot be fixed in this repository.
# Deleting this file does not open the gate: every scan names it, and Trivy stops when it is missing.
#
# Everything below is about third-party images that run only as local development services and as CI
# test services (ports on 127.0.0.1, throwaway credentials, no deploy target). Check every entry again
# before any of these images is used for anything else.
#
# Evidence for the gosu entries, taken on 2026-11-05:
#   - Images: app-mongo:scan built from infra/mongo (FROM mongo:8 = MongoDB 8.3.13,
#     mongo@sha256:e16e606f792ea89d2b4907b54e5e31eb86a7a23e27231dce3a982cc8f2d73cd2) and
#     postgres:17@sha256:3b0cda93be7c8dba2ed484d19393d93845dc3dafb88973e248ba8e6d99d784e1.
#   - Checked again on 2026-11-08 for postgres:18 (18.6, Debian 13.7,
#     postgres@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42), which replaced
#     postgres:17: its /usr/local/bin/gosu has the same sha256 and the same `go version -m` output, and
#     Trivy 0.69.3 reports the same 26 CVEs for it, so the evidence below covers it unchanged.
#   - Both ship the same /usr/local/bin/gosu, sha256
#     52c8749d0142edd234e9d6bd5237dff2d81e71f43537e2f4f66f75dd4b243dd0: gosu v1.19.0, go1.24.6,
#     -trimpath, CGO_ENABLED=0, deps github.com/moby/sys/user v0.1.0 and golang.org/x/sys v0.1.0
#     (`go version -m`).
#   - `govulncheck@v1.1.4 -mode=binary -format=json` (run with go1.25.6) against the vulnerability
#     database of that day, with each CVE matched to its GO ID through the OSV aliases (each statement
#     below names the GO ID and the package): none of the 26 CVEs below is reachable. 25 are at module level (the package is not in the binary), one is at
#     package level (os, without the vulnerable os.Root code). `go tool nm` agrees: 0 text symbols for
#     crypto/tls, crypto/x509, net, net/http, net/url, net/mail, net/textproto, mime, encoding/xml,
#     encoding/asn1, html/template, golang.org/x/net and os.(*Root); os, os/exec and syscall are present.
#   - Limits: binary mode trusts the symbol table and the build info in the binary, and the vulnerability
#     database's package and symbol data; it cannot see code paths that reflection or linkname would add.
#     It reported one reachable issue that Trivy does not gate on: GO-2026-6686 (moby/sys/user, DoS when
#     parsing the user and group files), whose input is the image's own /etc/passwd and /etc/group.
#   - gosu only looks up a user, drops privileges and execs the database. The entries disappear when the
#     images ship a gosu built with a newer Go; the purl pins the version, so a new gosu is checked again.

