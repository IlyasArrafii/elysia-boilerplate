  # js-yaml 3.13.1 bundled at /opt/js-yaml in the official mongo image (8.3.13, digest above). The image's
  # docker-entrypoint.sh loads it (via /js-yaml.js) only in _parse_config, to read a config file passed
  # with --config. No compose service passes --config: docker-compose.test.yml and docker-compose.yml run
  # the image's default command, docker-compose.dev.yml runs `docker-entrypoint.sh mongod`.
  - id: CVE-2026-59869 # HIGH, fixed in 3.15.0, 4.3.0
    paths: [opt/js-yaml/package.json]
    purls: [pkg:npm/js-yaml@3.13.1]
    statement: >-
      Denial of service through a crafted YAML document. js-yaml only parses a --config file, and no
      service of this repository passes --config, so no YAML reaches it.
    owner: IlyasArrafii
    expired_at: 2027-02-05
  - id: CVE-2026-84375 # HIGH, fixed in 3.15.2, 4.3.2
